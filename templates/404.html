{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-muted mb-3">404</div>
  <h3 class="fw-bold text-dark">Page Not Found</h3>
  <p class="text-muted small mb-4">The financial page or record you are searching for does not exist.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">
    <i class="bi bi-house me-1"></i> Return to Dashboard
  </a>
</div>
{% endblock %}

{% block auth_content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-muted mb-3">404</div>
  <h3 class="fw-bold text-dark">Page Not Found</h3>
  <a href="{{ url_for('auth.login') }}" class="btn btn-primary-custom mt-3">Return to Login</a>
</div>
{% endblock %}
